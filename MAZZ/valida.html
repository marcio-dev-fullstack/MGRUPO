<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Certificado - MAZZ Cursos e Capacitações</title>
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #c59b27;
            --success: #2e7d32;
            --error: #c62828;
            --bg: #f4f6f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            padding: 25px 20px;
            text-align: center;
            color: #fff;
        }

        .header img {
            max-width: 180px;
            height: auto;
            margin-bottom: 12px;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #0f2341;
        }

        /* Status Badge */
        .status-badge {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .status-valid {
            background-color: #e8f5e9;
            color: var(--success);
            border: 1px solid #a5d6a7;
        }

        .status-invalid {
            background-color: #ffebee;
            color: var(--error);
            border: 1px solid #ef9a9a;
        }

        /* Tabela de Resultados */
        .result-details {
            display: none;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 0.95rem;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: var(--primary);
            font-weight: 600;
            text-align: right;
            max-width: 60%;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            font-size: 0.75rem;
            color: #777;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <!-- Logo Inserida -->
        <img src="022.png" alt="MAZZ Cursos e Capacitações">
        <h1>Portal Oficial de Validação de Certificados</h1>
    </div>

    <div class="content">
        <div class="search-box">
            <input type="text" id="codigoInput" placeholder="Digite o Código (Ex: MAZZ-2026-0891)">
            <button onclick="validarCodigo()">Validar</button>
        </div>

        <div id="statusBadge" class="status-badge"></div>

        <div id="resultDetails" class="result-details">
            <div class="detail-row">
                <span class="detail-label">Aluno:</span>
                <span class="detail-value" id="valAluno">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Curso:</span>
                <span class="detail-value" id="valCurso">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Carga Horária:</span>
                <span class="detail-value" id="valCH">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Instrutor:</span>
                <span class="detail-value" id="valProfessor">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Data de Conclusão:</span>
                <span class="detail-value" id="valData">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Código de Registro:</span>
                <span class="detail-value" id="valCodigo">-</span>
            </div>
        </div>
    </div>

    <div class="footer">
        MAZZ Cursos e Capacitações • CNPJ 68.664.946/0001-96<br>
        Cuiabá - MT • Sistema de Autenticidade Digital
    </div>
</div>

<script>
    // Banco de Dados Simulado (Substitua ou integre com seu backend/API futuro)
    const registrosCertificados = {
        "MAZZ-2026-0891": {
            aluno: "Carlos Eduardo Silva",
            curso: "Especialização em Gestão de Segurança do Trabalho",
            ch: "40 horas",
            professor: "Prof. Roberto Mazzer",
            data: "27/08/2026"
        }
    };

    function validarCodigo() {
        const input = document.getElementById('codigoInput').value.trim().toUpperCase();
        const statusBadge = document.getElementById('statusBadge');
        const resultDetails = document.getElementById('resultDetails');

        if (!input) {
            alert('Por favor, informe um código de verificação.');
            return;
        }

        const certificado = registrosCertificados[input];

        if (certificado) {
            // Sucesso / Válido
            statusBadge.className = "status-badge status-valid";
            statusBadge.innerHTML = "✓ Certificado Autêntico e Válido";
            statusBadge.style.display = "flex";

            document.getElementById('valAluno').innerText = certificado.aluno;
            document.getElementById('valCurso').innerText = certificado.curso;
            document.getElementById('valCH').innerText = certificado.ch;
            document.getElementById('valProfessor').innerText = certificado.professor;
            document.getElementById('valData').innerText = certificado.data;
            document.getElementById('valCodigo').innerText = input;

            resultDetails.style.display = "block";
        } else {
            // Inválido / Não Encontrado
            statusBadge.className = "status-badge status-invalid";
            statusBadge.innerHTML = "✕ Certificado Não Encontrado ou Inválido";
            statusBadge.style.display = "flex";

            resultDetails.style.display = "none";
        }
    }

    // Leitura Automática do Parâmetro via URL (Ex: valida.html?codigo=MAZZ-2026-0891)
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const codigoUrl = urlParams.get('codigo');

        if (codigoUrl) {
            document.getElementById('codigoInput').value = codigoUrl;
            validarCodigo();
        }
    };
</script>

</body>
</html>
